name: Import Holm Ladies 1947 card artwork

on:
  push:
    branches: [feat/holm-ladies-1947-history-card]
    paths: [.github/workflows/import-holm-ladies-artwork.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - name: Check out artwork branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image converter
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Fetch approved generated artwork and optimise
        run: |
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps

          assets = {
              "front": "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/f921980ec836f8b90fa8e5a74023251d0a477354bec146899e3c82e3a931fc9e.png",
              "back": "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/04eae35ab1153efd4b7e57154c73275631a33c73e1865a4a1e61978de08fbced.png",
          }
          output = Path("public/player-space/history/specials")
          output.mkdir(parents=True, exist_ok=True)
          for face, url in assets.items():
              response = urlopen(Request(url, headers={"User-Agent": "STAR-Card-Importer/1.0"}), timeout=90)
              raw = response.read()
              image = Image.open(BytesIO(raw)).convert("RGB")
              if image.width < 600 or image.height < 800:
                  raise RuntimeError(f"{face}: source is smaller than expected")
              image = ImageOps.pad(image, (800, 1200), method=Image.Resampling.LANCZOS, color=(35, 29, 27))
              target = output / f"margaret-flett-holm-se03-{face}.webp"
              image.save(target, format="WEBP", quality=86, method=6)
              print(f"Saved {target}: {target.stat().st_size} bytes")
          PY
      - name: Commit collectible artwork to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/player-space/history/specials/margaret-flett-holm-se03-front.webp public/player-space/history/specials/margaret-flett-holm-se03-back.webp
          if git diff --cached --quiet; then
            echo 'Artwork already committed.'
          else
            git commit -m 'Add optimised illustrated Margaret Flett and Holm Ladies collectible artwork'
            git push
          fi
