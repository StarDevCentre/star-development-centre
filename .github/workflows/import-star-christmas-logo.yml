name: One-time Christmas logo import
on:
  push:
    branches: [feature/public-events-page-20261108]
    paths: [.github/workflows/import-star-christmas-logo.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-events-page-20261108
          persist-credentials: true
      - name: Download exact full-resolution logo
        env:
          THUMBNAIL_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Faa40b813-3b5d-4d06-bc74-96565e47ba2c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAIKmqmyGFd1OiclKUtxbgSIY6ndftxP9_0PEEhgyKoPk&exp=1794202203&osig=AAAAAAAAAAAAAAAAAAAAAIaU7iGUVi7BMYIFLXrtCpon2T9mf01OhBKjdhRCCLYK&signer=media-rpc&token=AAIAAU0AJGFhNDBiODEzLTNiNWQtNGQwNi1iYzc0LTk2NTY1ZTQ3YmEyYwAAAAABob7I83iw7QbDFHce5BXyXlgkzC1I420fvhBLv_jPYnc_Ew4Acg&x-canva-quality=thumbnail"
          IMAGE_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:1254/quality:100/uri:ifs%3A%2F%2FM%2Faa40b813-3b5d-4d06-bc74-96565e47ba2c/watermark:F/width:1254?csig=AAAAAAAAAAAAAAAAAAAAAIKmqmyGFd1OiclKUtxbgSIY6ndftxP9_0PEEhgyKoPk&exp=1794202203&osig=AAAAAAAAAAAAAAAAAAAAAIaU7iGUVi7BMYIFLXrtCpon2T9mf01OhBKjdhRCCLYK&signer=media-rpc&token=AAIAAU0AJGFhNDBiODEzLTNiNWQtNGQwNi1iYzc0LTk2NTY1ZTQ3YmEyYwAAAAABob7I83iw7QbDFHce5BXyXlgkzC1I420fvhBLv_jPYnc_Ew4Acg&x-canva-quality=original"
        run: |
          set -euo pipefail
          mkdir -p public/events
          if ! curl --fail --location --silent --show-error "$IMAGE_URL" -o public/events/star-christmas-festival.png; then
            echo "Original resolution unavailable; using Canva copy of supplied logo."
            curl --fail --location --silent --show-error "$THUMBNAIL_URL" -o public/events/star-christmas-festival.png
          fi
          python3 - <<'PY'
          import struct
          p='public/events/star-christmas-festival.png'
          with open(p,'rb') as f:
              data=f.read(24)
          assert data[:8]==b'\x89PNG\r\n\x1a\n', 'Not a PNG'
          w,h=struct.unpack('>II',data[16:24])
          print('Received logo size:',w,h)
          assert w>=150 and h>=150, 'Supplied logo unavailable'
          PY
      - name: Commit original logo and remove one-time workflow
        run: |
          git config user.name "star-events-asset-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/import-star-christmas-logo.yml
          git add public/events/star-christmas-festival.png .github/workflows/import-star-christmas-logo.yml
          git commit -m "Use exact supplied Christmas Festival logo"
          git push
