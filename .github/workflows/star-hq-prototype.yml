name: STAR HQ isolated prototype verification

on:
  push:
    branches:
      - feature/star-hq-reception-prototype
      - feature/star-hq-v2-visual-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Static checks and production build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: STAR HQ isolated prototype tests
        run: node --test scripts/test-star-hq-prototype.cjs scripts/test-star-hq-v2.cjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Existing project regression checks and Next.js build
        run: npm run build
      - name: Smoke test licensed 3D models through the production server
        run: |
          ./node_modules/.bin/next start -p 8137 > /tmp/star-hq-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --silent --fail -o /dev/null http://127.0.0.1:8137/; then break; fi
            sleep 1
          done
          node scripts/smoke-star-hq-v2-assets.mjs
